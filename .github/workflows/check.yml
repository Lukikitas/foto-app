name: Validate application
on:
  pull_request:
  push:
    branches: ['codex/**', 'restore-e44b86f']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:database
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-only
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: foto_app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: foto_app_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/database/bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260927090000_reviewed_complaint_imports.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260927090000_reviewed_complaint_imports.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261008090000_photo_cleanup_settings.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261008090000_photo_cleanup_settings.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/database/reviewed-imports.sql

      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011090000_storage_usage.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011090000_storage_usage.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/database/storage-usage.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023090000_performance_reads.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023090000_performance_reads.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/database/performance-reads.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/database/storage-summary.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023091000_photo_thumbnails.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023091000_photo_thumbnails.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/database/photo-thumbnails.sql
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run prepare:thumbnails
      - run: deno check --node-modules-dir=none --no-lock supabase/functions/performance-data/index.ts supabase/functions/photo-thumbnails/index.ts
      - run: deno test --node-modules-dir=none --no-lock --allow-read supabase/functions/photo-thumbnails/thumbnail_test.ts
