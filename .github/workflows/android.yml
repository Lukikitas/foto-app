name: Android Camera CI

on:
  push:
    branches: ['codex/**', 'main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-camera-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Android Camera App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-camera
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: gradle lintDebug --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify Release Build
        run: gradle assembleRelease --no-daemon

      - name: Compute SHA-256 Checksum
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            CHECKSUM=$(sha256sum "$APK_PATH" | awk '{print $1}')
            echo "### Android Camera Debug APK" >> $GITHUB_STEP_SUMMARY
            echo "- **Path:** \`$APK_PATH\`" >> $GITHUB_STEP_SUMMARY
            echo "- **SHA-256:** \`$CHECKSUM\`" >> $GITHUB_STEP_SUMMARY
            echo "APK_SHA256=$CHECKSUM" >> $GITHUB_ENV
          else
            echo "APK not found at $APK_PATH"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fotoapp-camera-debug-apk
          path: android-camera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
