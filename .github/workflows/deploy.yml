name: Deploy to GitHub Pages

on:
  push:
    branches: [restore-e44b86f]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Desplegar las funciones de rendimiento antes de publicar
        type: boolean
        default: false
        required: true
      publish_frontend:
        description: Publicar el frontend después de las verificaciones
        type: boolean
        default: true
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:thumbnails
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Deploy performance functions with bundled WASM
        run: supabase functions deploy performance-data photo-thumbnails --project-ref jngwzemzllyohrywzxew
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Verify current production reads before publishing
        run: node scripts/verify-performance.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Verify two production thumbnail jobs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PHOTO_THUMBNAIL_SECRET: ${{ secrets.PHOTO_THUMBNAIL_SECRET }}
        run: |
          node --input-type=module <<'JS'
          for(let n=0;n<2;n++) {
            const response=await fetch(process.env.SUPABASE_URL+'/functions/v1/photo-thumbnails',{method:'POST',headers:{Authorization:'Bearer '+process.env.SUPABASE_ANON_KEY,apikey:process.env.SUPABASE_ANON_KEY,'x-thumbnail-secret':process.env.PHOTO_THUMBNAIL_SECRET},signal:AbortSignal.timeout(45000)});
            if(!response.ok)throw new Error('Thumbnail verification failed: HTTP '+response.status);
            const result=await response.json();
            if(result.idle)break;
            if(!result.attached)throw new Error('The generated thumbnail could not be attached.');
            console.log('OK thumbnail '+(n+1));
          }
          JS
  build:
    needs: backend
    if: ${{ !cancelled() && (needs.backend.result == 'success' || needs.backend.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.publish_frontend) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLOUD_OCR_ENABLED: ${{ vars.VITE_CLOUD_OCR_ENABLED }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
